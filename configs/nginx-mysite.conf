# /etc/nginx/sites-available/mysite on web01 (HTTPS with a self-signed lab certificate)
# Enable: ln -s /etc/nginx/sites-available/mysite /etc/nginx/sites-enabled/mysite
# Test:   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name web.lab.teboho.co.za;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name web.lab.teboho.co.za;

    ssl_certificate     /etc/nginx/ssl/web.crt;
    ssl_certificate_key /etc/nginx/ssl/web.key;

    root /var/www/mysite;
    index index.html;            # lowercase: Linux is case sensitive (Index.html caused a 403)

    location / {
        try_files $uri $uri/ =404;
    }

    # Keep repo files out of the web root, or block them
    location ~ /\.(git|gitignore) { deny all; }
    location ~* README\.md$ { deny all; }
}
